name: CI
on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build firmware
        run: |
          nix develop --command bash -c '
            set -e
            cd code
            west init -l .
            west update
            west zephyr-export
            west build -b teensy41 app
          '

      - name: Run pre-commit hooks
        run: |
          nix develop .#pre-commit --command bash -c '
            set -e
            pre-commit run --all-files
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              git log -1 --format=%B > /tmp/commit-msg
              pre-commit run --hook-stage commit-msg --commit-msg-file /tmp/commit-msg
            fi
          '


