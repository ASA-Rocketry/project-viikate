common:
  tags: hil
  platform_allow:
    - teensy41
  integration_platforms:
    - teensy41
  # Needs the physical rig; run with code/tests/hil/run.sh.

tests:
  viikate.hil.boot:
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_boot.py"
      # Flash and power-cycle once, then run every test against that boot.
      pytest_dut_scope: module
    timeout: 180

  viikate.hil.log:
    # The flight image plus a shell, to read the log files back.
    extra_args: EXTRA_CONF_FILE=shell.conf
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_log.py"
      pytest_dut_scope: module
    timeout: 600
