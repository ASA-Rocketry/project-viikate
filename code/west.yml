manifest:
  projects:
    - name: zephyr
      path: zephyr
      url: https://github.com/zephyrproject-rtos/zephyr
      revision: 6eee4fecf07cc5f4382602dc26896ce3dfc9f3e0
      import:
        # Dependencies for Teensy 4.1 and the application's ST sensors.
        name-allowlist:
          # The pinned CMSIS-DSP integration still references this module.
          - cmsis
          - cmsis_6
          - hal_nxp
          - hal_st

    - name: cmsis-dsp
      url: https://github.com/ARM-software/CMSIS-DSP
      revision: 47a832f6438d623f27373645d849e1debb989908
      path: modules/lib/cmsis-dsp

  self:
    path: app
