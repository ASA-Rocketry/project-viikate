# Everything the logger (include/logger.h) needs.

CONFIG_RING_BUFFER=y
# Floats and 64-bit integers in log lines.
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_FULL_INTEGRAL=y

CONFIG_FILE_SYSTEM=y

# Every line goes to the microSD card, FAT formatted.
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
# Rotated logs are named log.1.txt, which needs long file names.
CONFIG_FS_FATFS_LFN=y
# Never format the card when it fails to mount: that would erase earlier logs.
CONFIG_FS_FATFS_MOUNT_MKFS=n
# Cards over 32 GB (SDXC) come formatted as exFAT.
CONFIG_FS_FATFS_EXFAT=y

# Critical lines also go to littlefs on the onboard flash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
# Same as cache-size of the lfs node in app.overlay. littlefs sizes its file
# cache heap from this, so with a smaller value only one file fits: the
# logger's crit.txt, and opening any other file fails with -ENOMEM.
CONFIG_FS_LITTLEFS_CACHE_SIZE=256
# The flash is mounted at boot on the main thread, and littlefs needs far more
# than the default 1 KiB of stack. Overflowing it trips the stack guard, which
# halts the board before USB comes up.
CONFIG_MAIN_STACK_SIZE=4096
# The Teensy SD slot has no card detect pin, so the SD host driver warns
# "assuming card is present" on every access. A missing card still shows up
# as a failed mount, which the logger reports.
CONFIG_SDHC_LOG_LEVEL_ERR=y

# A failed ASSERT (include/check.h) resets the board once the logs are stored.
CONFIG_REBOOT=y
