# Board-level differences for native_sim. code/app/prj.conf is used as is.
# No USB on native_sim; the console goes to stdout.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# 10 us ticks so the 1 ms plant step and the firmware's 1 ms loop are exact.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000
CONFIG_SENSOR_LOG_LEVEL_DBG=n
